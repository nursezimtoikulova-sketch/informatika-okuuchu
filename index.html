<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Информатика · окуучулар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: шапка + класс тилкеси; сабак барагы — өтмөктөр (План · Түшүндүрмө · Слайд · Оюн · Практика · Тест).
   Түстөр мугалимдин презентацияларынан: кочкул көк, жашыл-көгүлтүр, апельсин. */
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface2:#ebe9e2; --line:#d9d6cc;
  --ink:#15233f; --ink2:#4b5670; --muted:#7a8296;
  --navy:#1b2b4f; --teal:#178f84; --teal-soft:#d6efeb; --orange:#e8873d; --orange-soft:#fbe6d4;
  --good:#1f8a4c; --good-soft:#d9f2e3; --bad:#c8402f; --bad-soft:#f8dcd7;
  --k1:#e21b3c; --k2:#1368ce; --k3:#d89e00; --k4:#26890c;
  --slide-bg:#f2efe8; --slide-ink:#1b2b4f;
  --f-head:"Rubik","Segoe UI","Arial",sans-serif; --f-body:"Nunito","Segoe UI","Arial",sans-serif; --f-mono:"JetBrains Mono","Consolas",monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10172a; --surface:#18213a; --surface2:#222c48; --line:#2f3a5a;
  --ink:#eef1f8; --ink2:#b8c0d6; --muted:#8a93ad;
  --navy:#9fb4ea; --teal:#3cc3b4; --teal-soft:#16393a; --orange:#f39a55; --orange-soft:#3d2a1c;
  --good:#46c47a; --good-soft:#163525; --bad:#ef6a57; --bad-soft:#3b1d1a;
  --slide-bg:#1b2440; --slide-ink:#eef1f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10172a; --surface:#18213a; --surface2:#222c48; --line:#2f3a5a;
  --ink:#eef1f8; --ink2:#b8c0d6; --muted:#8a93ad;
  --navy:#9fb4ea; --teal:#3cc3b4; --teal-soft:#16393a; --orange:#f39a55; --orange-soft:#3d2a1c;
  --good:#46c47a; --good-soft:#163525; --bad:#ef6a57; --bad-soft:#3b1d1a;
  --slide-bg:#1b2440; --slide-ink:#eef1f8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance;color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a{color:var(--teal)}
code{font-family:var(--f-mono);font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:5px;word-break:break-all}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1b2b4f;color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--f-head);font-weight:600;font-size:17px;margin-right:auto}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#e8873d;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:#1b2b4f}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;opacity:.7;letter-spacing:.04em}
.gchips{display:flex;gap:6px}
.gchip{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;text-decoration:none}
.gchip.on{background:#e8873d;border-color:#e8873d;color:#1b2b4f}
.who{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding-block:20px 60px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:800;background:var(--navy);color:var(--bg);text-decoration:none;min-height:44px}
:root .btn{background:#1b2b4f;color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.orange{background:#e8873d;color:#1b2b4f}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical}
label.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:4px;color:var(--ink2)}
/* home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch;margin-bottom:22px}
.hero h1{font-size:clamp(26px,4vw,38px)}
.hero p{color:var(--ink2);max-width:60ch}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gcard{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--ink);min-width:0}
.gcard:hover{border-color:var(--teal)}
.gcard .num{font-family:var(--f-head);font-size:40px;font-weight:700;line-height:1;color:var(--navy)}
.gcard .meta{font-size:14px;color:var(--ink2)}
.gcard .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:auto}
.gcard .bar i{display:block;height:100%;background:var(--teal)}
.calc{font-size:14px}
.calc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.calc td,.calc th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.calc th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* grade page */
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ghead h1{font-size:clamp(24px,3.5vw,32px)}
.weeks{display:grid;gap:14px}
.week{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}
.week .wl{font-family:var(--f-head);font-weight:600;color:var(--muted);font-size:14px;padding-top:14px}
.week .ls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.lcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.lcard:hover{border-color:var(--teal)}
.lcard .n{flex:none;width:40px;height:40px;border-radius:10px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-family:var(--f-head);font-weight:700}
.lcard.done .n{background:var(--good);color:#fff}
.lcard .t{font-weight:800;line-height:1.3}
.lcard .s{font-size:13px;color:var(--ink2);margin-top:3px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--surface2);color:var(--ink2);letter-spacing:.02em}
.tag.th{background:var(--teal-soft);color:var(--teal)}
.tag.pr{background:var(--orange-soft);color:#b5571a}
:root[data-theme="dark"] .tag.pr{color:var(--orange)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.pr{color:var(--orange)}}
/* lesson */
.crumbs{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted)}
.lhead h1{font-size:clamp(22px,3.4vw,32px);margin-bottom:6px}
.lhead .goal{color:var(--ink2);max-width:72ch}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:18px 0 18px;scrollbar-width:thin}
.tab{flex:none;border:0;background:transparent;padding:10px 14px;font-weight:800;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:#e8873d}
.pane{display:grid;gap:14px}
.plan{display:grid;gap:8px}
.pstep{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pstep .min{font-family:var(--f-mono);font-weight:700;color:var(--teal);font-size:14px}
.pstep b{display:block}
.pstep span{font-size:14px;color:var(--ink2)}
.xblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.xblock h3{font-size:18px;margin-bottom:6px}
.xblock p{margin:0;max-width:75ch}
.xblock.lv{border-color:var(--orange);background:var(--orange-soft)}
.xblock.lv h3{color:var(--ink)}
.xblock.rp{border-color:var(--teal);background:var(--teal-soft)}
.xblock.rp .lvtag{color:var(--teal)}
.lvtag{font-size:11px;font-weight:800;color:#b5571a;letter-spacing:.06em;text-transform:uppercase}
/* slides */
.deck{display:grid;gap:10px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--slide-bg);color:var(--slide-ink);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.deck.fs .stage{border-radius:0;border:0}
.slide{position:absolute;inset:0;padding:5.5% 6.5%;display:flex;flex-direction:column;gap:2.4cqh;container-type:size}
.stage{container-type:inline-size}
.slide h2{font-family:var(--f-head);color:var(--slide-ink);font-size:5cqw;font-weight:700}
.slide .sp{font-size:2.6cqw;color:var(--slide-ink);opacity:.85}
.slide ul{margin:0;padding-left:1.2em;font-size:2.7cqw;display:grid;gap:.5em}
.slide li::marker{color:#e8873d}
.slide .note{margin-top:auto;font-size:2.2cqw;font-weight:800;color:#c86a22;border-left:5px solid #e8873d;padding-left:.7em}
.slide .big{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--f-head);font-size:4.4cqw;font-weight:600;line-height:1.35}
.slide table{border-collapse:collapse;font-size:2.4cqw;width:100%}
.slide td,.slide th{border-bottom:2px solid rgba(127,127,127,.25);padding:.4em .6em;text-align:left}
.slide th{background:#1b2b4f;color:#fff;font-family:var(--f-head);font-weight:600}
.slide.title{background:#1b2b4f;color:#fff;justify-content:center}
.slide.title h2{color:#fff;font-size:6cqw}
.slide.title .kick{font-family:var(--f-head);color:#e8873d;font-size:2.4cqw;letter-spacing:.1em;text-transform:uppercase}
.slide.title .sp{color:#fff}
.slide .dots{position:absolute;right:5%;bottom:6%;display:flex;gap:1cqw}
.slide .dots i{width:5cqw;height:5cqw;border-radius:50%;display:block}
.slide .pg{position:absolute;right:3%;bottom:3%;font-size:1.6cqw;opacity:.5;font-family:var(--f-mono)}
.slide .lvb{position:absolute;right:3%;top:3%;font-size:1.6cqw;font-weight:800;background:#e8873d;color:#1b2b4f;border-radius:.4em;padding:.2em .6em}
.dctl{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.deck.fs{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.deck.fs .stage{max-height:100%;width:auto;max-width:100%;margin:auto}
.deck.fs .dctl{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);opacity:.25;background:#000;border-radius:12px;padding:6px}
.deck.fs .dctl:hover{opacity:1}
/* games */
.glist{display:grid;gap:14px}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.gbox>h3{font-size:18px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.kind{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.kind.phone{background:var(--teal-soft);color:var(--teal)}
.kind.pc{background:#e1e7f7;color:#1b2b4f}
.kind.paper{background:var(--orange-soft);color:#b5571a}
:root[data-theme="dark"] .kind.pc{background:#26345a;color:#c9d6f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kind.pc{background:#26345a;color:#c9d6f6}}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.qcard{background:var(--surface2);border-radius:10px;padding:18px;text-align:center;font-size:20px;font-weight:800;min-height:90px;display:grid;place-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:800;min-height:52px}
.opt:hover{border-color:var(--teal)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);font-weight:700}
.fb{font-weight:800;min-height:1.5em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.done{background:var(--good-soft);border:1px solid var(--good);border-radius:10px;padding:14px;display:grid;gap:8px}
.done b{font-size:18px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700;text-align:left;min-height:48px}
.mi.sel{border-color:var(--orange);background:var(--orange-soft)}
.mi.ok{border-color:var(--good);background:var(--good-soft);opacity:.7}
.mi.no{border-color:var(--bad);background:var(--bad-soft)}
.olist{display:grid;gap:6px}
.oi{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;border:2px solid transparent}
.oi .on{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.oi.ok{border-color:var(--good);background:var(--good-soft)} .oi.no{border-color:var(--bad);background:var(--bad-soft)}
.oi .mv{display:flex;gap:4px}
.oi .mv button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800}
/* quiz (Kahoot-style) */
.qz{display:grid;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
.timer{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:#e8873d;transition:width .25s linear}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;font-family:var(--f-head);font-size:clamp(20px,3vw,30px);font-weight:600;min-height:110px;display:grid;place-items:center}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ka{border:0;border-radius:10px;color:#fff;font-weight:800;font-size:18px;padding:16px 14px;min-height:76px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ka svg{flex:none;width:28px;height:28px}
.ka.k0{background:var(--k1)} .ka.k1{background:var(--k2)} .ka.k2{background:var(--k3)} .ka.k3{background:var(--k4)}
.ka.dim{opacity:.3} .ka.right{outline:4px solid var(--ink);outline-offset:2px}
.qz.big .qq{font-size:clamp(24px,4vw,44px);min-height:160px}
.qz.big .ka{font-size:clamp(18px,2.4vw,28px);min-height:110px}
.score{font-family:var(--f-head);font-size:44px;font-weight:700;color:var(--navy);line-height:1}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode .card{display:grid;gap:8px}
/* send panel */
.send{border:2px dashed var(--teal);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface)}
.send pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:var(--f-mono);font-size:12px;background:var(--surface2);padding:10px;border-radius:8px;max-height:150px;overflow:auto;user-select:all}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2b4f;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* widgets */
.grid-lg{display:grid;gap:4px;overflow-x:auto}
.lg table{border-collapse:collapse}
.lg td,.lg th{border:1px solid var(--line);padding:0;text-align:center}
.lg th{padding:6px 8px;font-size:13px;background:var(--surface2)}
.lg td button{width:56px;height:48px;border:0;background:var(--surface);font-size:22px;font-weight:800}
.clues{margin:0;padding-left:1.2em}
.pgrid{display:grid;gap:2px;touch-action:none;user-select:none;max-width:100%}
.pgrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);padding:0;min-width:0;border-radius:3px;font-size:11px;font-weight:800;line-height:1;overflow:hidden}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.pal button{border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:800;font-size:14px;background:var(--surface)}
.pal button.on{border-color:var(--ink)}
.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.bit{border:0;border-radius:10px;padding:10px 0;background:var(--surface2);display:grid;gap:2px;justify-items:center;min-width:0}
.bit b{font-family:var(--f-mono);font-size:26px}
.bit small{font-size:11px;color:var(--muted);font-weight:800}
.bit.on{background:#e8873d;color:#1b2b4f}
.bit.on small{color:#1b2b4f}
.mono{font-family:var(--f-mono)}
.bigval{font-family:var(--f-mono);font-size:28px;font-weight:700}
.typeline{font-family:var(--f-mono);font-size:20px;background:var(--surface2);padding:12px;border-radius:10px;word-break:break-word}
.typeline .c{color:var(--good)} .typeline .w{color:var(--bad);background:var(--bad-soft)} .typeline .r{color:var(--muted)}
.marena{position:relative;height:300px;background:var(--surface2);border-radius:10px;overflow:hidden;touch-action:none;user-select:none}
.mt{position:absolute;width:58px;height:58px;border-radius:50%;border:0;background:#e8873d;color:#1b2b4f;font-weight:800;font-size:12px;display:grid;place-items:center;touch-action:none}
.mbox{position:absolute;right:12px;bottom:12px;width:110px;height:110px;border:3px dashed var(--teal);border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--teal);text-align:center}
.desk{position:relative;height:380px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#2a6cb0,#16457a 60%,#0f2f57);color:#fff;touch-action:none;user-select:none;font-family:"Segoe UI",var(--f-body)}
.dicons{position:absolute;left:10px;top:10px;display:grid;gap:10px}
.dicon{width:76px;border:0;background:transparent;color:#fff;display:grid;justify-items:center;gap:3px;font-size:12px;padding:4px;border-radius:6px;text-shadow:0 1px 2px #000}
.dicon:hover{background:rgba(255,255,255,.15)}
.dicon i{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}

/* ===== Виджеттер (уландысы) ===== */
function paintGrid(g, onCell){
  var on = false;
  function idxAt(e){ var t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentNode === g ? [].indexOf.call(g.children, t) : -1; }
  g.addEventListener("pointerdown", function(e){ var i = idxAt(e); if (i < 0) return; on = true; onCell(i, true); e.preventDefault(); });
  g.addEventListener("pointermove", function(e){ if (!on) return; var i = idxAt(e); if (i >= 0) onCell(i, false); });
  window.addEventListener("pointerup", function(){ on = false; });
}

        el("div", {class: "row", style: "justify-content:space-between"}, [el("b", {text: "Окуучулар үчүн код"}), el("span", {class: "bigval", text: code})]),
        el("span", {class: "muted", style: "font-size:14px", text: "Шилтеме түзүлүшү үчүн окуучулардын сайтынын дарегин бир жолу жазыңыз (ушул браузерде сакталат)."}),
        el("div", {class: "row", style: "flex-wrap:nowrap"}, [ui, el("button", {class: "btn teal", type: "button", text: "Сактоо", onclick: function(){ setStudentUrl(ui.value); }})])
      ]);
      var lh0 = w.querySelector(".lhead"); lh0.parentNode.insertBefore(c0, lh0.nextSibling); return;
    }
    var msg = g + "-класс, " + n + "-сабак: " + ctx.topic.title + "\nОюндар, практика жана тест: " + link + "\nСабактын коду: " + code;
    var pre = el("span", {class: "mono", text: link, style: "font-size:12px;word-break:break-all"});
    var card = el("div", {class: "send", style: "margin-top:14px"}, [
      el("div", {class: "row", style: "justify-content:space-between"}, [el("b", {text: "Окуучулар үчүн код"}), el("span", {class: "bigval", text: code})]),
      el("span", {class: "muted", style: "font-size:14px", text: "Кодду тактага жаз же шилтемени класстын WhatsApp тобуна жөнөт. Окуучулар бул сабактын оюндарын, практикасын жана тестин гана көрөт."}),
      pre,
      el("button", {class: "btn ghost sm", type: "button", style: "justify-self:start", text: "Окуучулар сайтынын дарегин өзгөртүү", onclick: function(){ setStudentUrl(""); }}),
      el("div", {class: "row"}, [
        el("a", {class: "btn teal sm", href: "https://wa.me/?text=" + encodeURIComponent(msg), target: "_blank", rel: "noopener", text: "WhatsApp тобуна жөнөтүү"}),
        el("button", {class: "btn ghost sm", type: "button", text: "Шилтемени көчүрүү", onclick: function(){ copyText(msg, pre); }})
      ])
    ]);
    var lh = w.querySelector(".lhead"); lh.parentNode.insertBefore(card, lh.nextSibling);
  };
  var _renderTop = renderTop;
  renderTop = function(){
    _renderTop();
    var who = topEl.querySelector(".who");
    if (who && !STUDENT_URL){ who.remove(); return; }
    if (who) who.replaceWith(el("a", {class: "who", href: STUDENT_URL, target: "_blank", rel: "noopener", text: "Окуучулардын сайты ↗", style: "text-decoration:none"}));
  };
}

if (STUDENT){
  parseHash = function(){
    var h = (location.hash || "").replace(/^#/, ""), m;
    if ((m = /^k(\d{4})$/.exec(h))){ var L = codeMap()[m[1]]; if (L) return {view: "lesson", g: L[0], n: L[1], code: m[1]}; return {view: "enter", bad: m[1]}; }
    if (h === "me") return {view: "me"};
    return {view: "enter"};
  };
  renderTop = function(){
    topEl.innerHTML = "";
    topEl.appendChild(el("div", {class: "wrap"}, [
      el("a", {class: "brand", href: "#enter"}, [el("span", {class: "mark", text: "01"}), el("span", null, ["Информатика", el("small", {text: "Окуучулар үчүн"})])]),
      ME ? el("a", {class: "who", href: "#me", style: "text-decoration:none", text: ME.name.split(" ")[0] + " · " + ME.cls}) : null
    ]));
  };
  render = function(){
    route = parseHash(); KEYH = null; renderTop();
    app.innerHTML = ""; var w = el("div", {class: "wrap", style: "max-width:760px"}); app.appendChild(w);
    if (!ME) return stName(w);
    if (route.view === "lesson") return stLesson(w, route.g, route.n);
    if (route.view === "me") return pageMe(w);
    stEnter(w, route.bad);
  };
  var stName = function(w){
    var name = el("input", {type: "text", id: "st-name", placeholder: "Мисалы: Айжан Токтосунова"});
    var letter = el("input", {type: "text", id: "st-letter", maxlength: "2", placeholder: "А, Б… (бош калса болот)"});
    var g = 0, gp = el("div", {class: "gpick"}), err = el("div", {class: "fb no"});
    GRADES.forEach(function(x){ gp.appendChild(el("button", {type: "button", text: String(x), onclick: function(e){ g = x; [].forEach.call(gp.children, function(b){ b.className = ""; }); e.currentTarget.className = "on"; }})); });
    w.appendChild(el("div", {class: "card", style: "display:grid;gap:12px;margin-top:10px"}, [
      el("h1", {style: "font-size:26px", text: "Кош келиң!"}),
      el("p", {class: "muted", style: "margin:0", text: "Аты-жөнүңдү толук жаз. Жыйынтыгың мугалимге ушул ат менен барат."}),
      el("div", null, [el("label", {class: "lbl", for: "st-name", text: "Аты-жөнү"}), name]),
      el("div", null, [el("label", {class: "lbl", text: "Класс"}), gp]),
      el("div", null, [el("label", {class: "lbl", for: "st-letter", text: "Класстын тамгасы"}), letter]),
      err,
      el("button", {class: "btn teal", type: "button", text: "Кирүү", onclick: function(){
        var n = name.value.trim().replace(/\s+/g, " ");
        if (n.split(" ").length < 2 || n.length < 5){ err.textContent = "Атыңды жана фамилияңды жаз."; return; }
        if (!g){ err.textContent = "Классыңды танда."; return; }
        saveMe({name: n.slice(0, 40), grade: g, cls: g + letter.value.trim().toUpperCase().slice(0, 2)}); render();
      }})
    ]));
  };
  var stEnter = function(w, bad){
    var inp = el("input", {type: "text", inputmode: "numeric", maxlength: "4", id: "st-code", placeholder: "0000", style: "font-family:var(--f-mono);font-size:28px;text-align:center;letter-spacing:.3em"});
    var fb = el("div", {class: "fb no", text: bad ? "«" + bad + "» — мындай код жок. Мугалимден кайра сура." : ""});
    function go2(){ var v = inp.value.replace(/\D/g, ""); if (codeMap()[v]) location.hash = "k" + v; else fb.textContent = "Код туура эмес. Мугалимден кайра сура."; }
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go2(); });
    w.appendChild(el("div", {class: "card", style: "display:grid;gap:12px;margin-top:10px"}, [
      el("h1", {style: "font-size:24px", text: "Сабактын кодун жаз"}),
      el("p", {class: "muted", style: "margin:0", text: "4 сандуу кодду мугалим сабакта берет."}),
      inp, fb,
      el("button", {class: "btn teal", type: "button", text: "Ачуу", onclick: go2})
    ]));
    setTimeout(function(){ inp.focus(); }, 50);
  };
  var stLesson = function(w, g, n){
    var ctx = lessonCtx(g, n), tab = "games";
    if (ME.grade !== g) w.appendChild(el("div", {class: "fb no", style: "margin-bottom:8px", text: "Эскертүү: бул сабак " + g + "-класс үчүн, сен " + ME.cls + "-класстасың."}));
    w.appendChild(el("div", {class: "lhead"}, [el("div", {class: "eyebrow", text: g + "-класс · " + n + "-сабак"}), el("h1", {text: ctx.topic.title})]));
    var tabs = el("div", {class: "tabs"}), pane = el("div", {class: "pane"});
    [["games", "Оюндар"], ["practice", "Практика"], ["quiz", "Тест"]].forEach(function(x){ tabs.appendChild(el("button", {class: "tab", type: "button", "data-t": x[0], text: x[1], onclick: function(){ show(x[0]); }})); });
    w.appendChild(tabs); w.appendChild(pane);
    w.appendChild(el("div", {class: "row", style: "margin-top:20px"}, [el("a", {class: "btn ghost sm", href: "#enter", text: "Башка сабактын коду"})]));
    function show(k){
      [].forEach.call(tabs.children, function(b){ b.className = "tab" + (b.getAttribute("data-t") === k ? " on" : ""); });
      pane.innerHTML = "";
      if (k === "games") renderGames(pane, ctx); else if (k === "practice") renderPractice(pane, ctx); else renderQuiz(pane, ctx);
      if (k === "quiz"){ var c = pane.querySelectorAll(".mode .card"); if (c[1]) c[1].remove(); }
    }
    show(tab);
  };
}
</script></body></html>
